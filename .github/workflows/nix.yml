name: Nix

on:
  push:
    branches: [main, develop]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - clippy.toml
      - .github/workflows/nix.yml
  # No paths filter on PRs: 'Flake Check' is a required check, and a
  # required check that never runs blocks the merge. All PRs run this
  # workflow; the expensive flake check self-skips when the flake inputs
  # are untouched. (A skipped required check still blocks a merge —
  # proven on v0.1.129, 2026-09-14 — so on release branches the check
  # must be produced by the bump-and-tag self-heal dispatch, which runs
  # it via the workflow_dispatch path below.)
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Flake Inputs Changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect flake-relevant changes
        id: filter
        run: |
          base=$(git merge-base origin/"${GITHUB_BASE_REF}" HEAD)
          if git diff --name-only "$base" HEAD | grep -qE '^(flake\.(nix|lock)|nix/|Cargo\.(toml|lock)|rust-toolchain\.toml|rustfmt\.toml|clippy\.toml|\.github/workflows/nix\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  nix-check:
    name: Flake Check
    needs: changes
    # always(): without it, a skipped `changes` job (non-pull_request
    # events, where `changes` has `if: github.event_name == 'pull_request'`)
    # skips this job via the needs-cascade no matter what the condition
    # below evaluates to — which silently broke the push and
    # workflow_dispatch paths.
    # Release PRs (chore/release-v*) still self-skip on the pull_request
    # path: the flake check is the longest, most variable required check
    # (14-40 min observed), so PRs don't wait on it. Note that a SKIPPED
    # required check DOES block the merge (proven on v0.1.129, 2026-09-14:
    # merge stayed BLOCKED with Flake Check skipped) — the release's Flake
    # Check therefore comes from the bump-and-tag self-heal dispatch,
    # which takes the workflow_dispatch path and runs the check.
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
      (needs.changes.outputs.changed == 'true' && !startsWith(github.head_ref, 'chore/release-v')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Check flake
        run: nix flake check --print-build-logs
