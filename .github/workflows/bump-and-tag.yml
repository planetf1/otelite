name: Bump version and tag

# Release pipeline — no-override design (2026-09-08, closes #188):
#
#   1. A push to main that ships release notes (bullets under
#      '## [Unreleased]' or per-PR changelog/*.md entries) triggers a
#      release.
#   2. The release job opens a "chore: release vX.Y.Z" pull request
#      carrying the version bump and the CHANGELOG rotation, waits for
#      the required checks, and squash-merges it with GITHUB_TOKEN —
#      the sanctioned path under branch protection. No admin-bypass
#      credential is involved anywhere in a normal release.
#   3. The merged commit is tagged vX.Y.Z (tags are not branch
#      protected), release.yml is dispatched for the binary builds,
#      GitHub release and Homebrew formula, and the crates.io publish
#      runs as the reusable job below.
#
#   Runs are serialised (concurrency group `release`) and always build
#   the release from the *latest* main, so back-to-back merges either
#   combine into one release or chain cleanly.
#
#   Manual dispatch (patch/minor/major) cuts a release on demand when
#   main carries notes a push did not release; with no notes it exits
#   cleanly.
#
#   Optional secret: RELEASE_PR_TOKEN — a fine-grained PAT of the owner
#   account scoped to this repo (Contents + Pull requests, read/write),
#   used ONLY to author the release PR (#202): app-authored PRs park
#   every pull_request run in action_required. Without it the workflow
#   falls back to GITHUB_TOKEN (one human approval step per release).
#   The FGP cannot bypass branch protection — it is a collaborator
#   credential, not an override.
#
#   Incident recovery (the only place override belongs): if a release
#   PR gets stuck, re-run the failed jobs (Actions → run → Re-run
#   failed) and merge by hand (`gh pr merge <n> --squash
#   --delete-branch`), tag the merged commit and dispatch release.yml —
#   or push the tagged commit to main with owner credentials.
#
#   Orphaned PR-only checks (v0.1.126 2026-09-10/11, and again on
#   v0.1.127/v0.1.128 2026-09-11/12): a force-push to the release branch
#   supersedes the head, and raw pushes do not re-fire pull_request
#   events — so PR-only workflows (Changelog Entry, Flake Check) had no
#   check run on the current head and the wait loop idled out its 50
#   iterations. The wait loop now detects required contexts missing on
#   the head (nothing in flight) and dispatches the owning workflow once
#   per orphaning event (self_healed latch, re-armed after each rebase
#   force-push); changelog.yml carries a workflow_dispatch trigger for
#   exactly this. Manual recovery (dispatch + close/reopen) remains the
#   fallback if the self-heal is insufficient.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Open and merge release PR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The gh CLI does not auto-use GITHUB_TOKEN in Actions; point it at the
    # workflow token so pr create / pr view / pr merge / workflow run work.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Guard: a release PR's own merge must not re-trigger this workflow.
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    outputs:
      new_version: ${{ steps.bump.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to latest main and gate on release notes
        # Always build the release from the *latest* main, not this
        # push's commit: under the concurrency group a later run can
        # start after an earlier release already consumed this push's
        # notes, in which case there is nothing to release.
        id: gate
        run: |
          set -euo pipefail
          git fetch -q origin main
          git checkout -q -B release-base origin/main
          unreleased_has=0
          awk '/^## \[Unreleased\]/{f=1;next} f&&/^## /{f=0} f' CHANGELOG.md | grep -qE '^- ' && unreleased_has=1
          entry_has=0
          for f in $(find changelog -maxdepth 1 -name '*.md' ! -name '.*' 2>/dev/null | sort); do
            if grep -qE '^- ' "$f"; then entry_has=1; break; fi
          done
          if [[ "$unreleased_has" -eq 0 && "$entry_has" -eq 0 ]]; then
            echo "main carries no release notes — nothing to release (skipping)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in Cargo.toml
        id: bump
        if: steps.gate.outputs.proceed == 'true'
        env:
          BUMP_KIND: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          current=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP_KIND" in
            major) new="$((major+1)).0.0" ;;
            minor) new="$major.$((minor+1)).0" ;;
            patch) new="$major.$minor.$((patch+1))" ;;
          esac
          sed -i "s/^version = \"$current\"/version = \"$new\"/" Cargo.toml
          echo "old=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: steps.gate.outputs.proceed == 'true'
        with:
          toolchain: stable

      - name: Update Cargo.lock
        if: steps.gate.outputs.proceed == 'true'
        run: cargo metadata --format-version 1 > /dev/null

      - name: Rotate CHANGELOG [Unreleased] → [X.Y.Z]
        # Fails if [Unreleased] is empty — every release must ship with notes.
        # See AGENTS.md → Changelog discipline.
        if: steps.gate.outputs.proceed == 'true'
        run: ./scripts/rotate-changelog.sh "${{ steps.bump.outputs.new }}"

      - name: Commit and open release PR
        id: pr
        if: steps.gate.outputs.proceed == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          # #202: author the PR with the owner's repo-scoped fine-grained
          # token when configured — an app-authored PR (github-actions[bot])
          # parks every pull_request run in action_required until a human
          # approves each. The FGP cannot bypass branch protection, so it
          # is a collaborator credential, not an override. Until the secret
          # exists, GH_TOKEN stays the workflow token (legacy behaviour).
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail
          branch="chore/release-v${NEW_VERSION}"
          if [[ -n "${RELEASE_PR_TOKEN:-}" ]]; then
            export GH_TOKEN="$RELEASE_PR_TOKEN"
          fi
          git checkout -q -b "$branch"
          git add Cargo.toml Cargo.lock CHANGELOG.md changelog/
          git commit -m "chore: release v${NEW_VERSION}"
          # Force: a re-run after a mid-release failure pushes a fresh
          # commit (new timestamp) onto the branch the failed run left.
          git push -q -f origin "$branch"
          body=$(printf 'Automatic release PR opened by the *Bump version and tag* workflow.\n\nCarries the version bump (Cargo.toml / Cargo.lock) and the CHANGELOG rotation for v%s. It merges by itself once the required checks pass — no manual action needed.\n\nIf a required check fails spuriously it is re-run once automatically; if it fails again, re-run it (Actions → run → Re-run failed jobs) and the merge will proceed, or merge by hand (gh pr merge <n> --squash --delete-branch), then tag the merged commit and dispatch release.yml.' "$NEW_VERSION")
          # #208: idempotent — while a release PR for the branch is open
          # (back-to-back pushes with release notes, manual re-runs),
          # adopt the existing PR instead of failing at 'gh pr create'.
          # The git push -f above already makes the branch itself
          # idempotent (the v0.1.125 fix); this makes the PR step match.
          if url=$(gh pr list --head "$branch" --state open --json url -q '.[0].url' 2>/dev/null) && [[ -n "$url" ]]; then
            echo "release PR already open: $url"
          else
            url=$(gh pr create --title "chore: release v${NEW_VERSION}" --body "$body")
          fi
          pr_number=${url##*/}
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "using $url"

      - name: Wait for checks, rebase if stale, squash-merge
        id: merge
        if: steps.gate.outputs.proceed == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -uo pipefail
          merged=0
          reran=0
          self_healed=0
          for i in $(seq 1 50); do
            status=$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q .mergeStateStatus 2>/dev/null || echo UNKNOWN)
            case "$status" in
              CLEAN|UNSTABLE)
                # Capture main's head immediately before merging so the
                # tag step can prove it tagged the exact squash commit.
                git fetch -q origin main
                echo "base_before=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
                gh pr merge "$PR_NUMBER" --squash --delete-branch
                echo "release PR #$PR_NUMBER squash-merged"
                merged=1
                break
                ;;
              BEHIND|HAS_COMMITS_BEHIND)
                echo "main moved — rebasing $BRANCH onto latest main (checks re-run)"
                git fetch -q origin main
                if ! git rebase -q origin/main; then
                  echo "rebase conflict — release needs manual intervention"
                  exit 1
                fi
                git push -q -f origin "$BRANCH"
                # The force-push orphans the PR-only check runs again
                # (#207) — re-arm the self-heal latch.
                self_healed=0
                ;;
              DIRTY)
                echo "merge conflict on $BRANCH — release needs manual intervention"
                exit 1
                ;;
              BLOCKED)
                # Required checks not met. Conclude failure only once
                # every check has settled (stale conclusions from a
                # superseded head must not count).
                head_oid=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid 2>/dev/null || echo "")
                if [[ -n "$head_oid" ]]; then
                  runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_oid}/check-runs" \
                    -q '[.check_runs[] | {status: .status, conclusion: (.conclusion // "none"), name: .name}]' 2>/dev/null || echo "[]")
                  in_progress=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
                  settled_failures=$(jq '[.[] | select(.status == "completed" and (.conclusion | ascii_downcase | IN("failure","error","timed_out","cancelled")))] | length' <<<"$runs")
                  # Self-heal for orphaned checks (#207, incidents on
                  # v0.1.126/127/128): a force-push to the release branch
                  # (re-run or rebase) supersedes the head, and raw pushes
                  # do not re-fire pull_request events — PR-only workflows
                  # (changelog.yml, nix.yml) then have no check run on the
                  # current head at all, and the loop waits out its 50
                  # iterations on checks that will never appear. With
                  # nothing in flight, dispatch the owning workflow for
                  # every required context missing on the head. Bounded by
                  # the self_healed latch (re-armed after each rebase
                  # force-push, which orphans again).
                  if [[ "$in_progress" -eq 0 && "$self_healed" -eq 0 ]]; then
                    # `|| required=""` (not an `|| echo ""` inside the
                    # substitution): on a 403 `gh api` prints the error
                    # JSON body to stdout, so the variable would be
                    # non-empty and the fallback below would never fire
                    # (observed on the v0.1.129 run: the 403 body was
                    # treated as one giant "context name").
                    required=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" \
                      -q '.required_status_checks.contexts[]?' 2>/dev/null) || required=""
                    if [[ -z "$required" ]]; then
                      # Reading branch protection requires the admin scope,
                      # which the workflow token does not have (403) — fall
                      # back to the configured required contexts. Keep this
                      # list in sync with the branch protection rule on
                      # main when it changes.
                      required=$(printf '%s\n' \
                        'Changelog Entry' 'Coverage' 'Dependency Audit' 'Dependency Check' \
                        'Documentation' 'Flake Check' 'Format Check' 'License Check' \
                        'Lint (Clippy)' 'SAST Scan' 'Secret Detection' 'Security Advisories' \
                        'Security Audit' 'Test (macos-latest)' 'Test (ubuntu-latest)')
                    fi
                    present=$(jq -r '.[].name' <<<"$runs" | sort -u)
                    missing=""
                    # Line-based iteration: context names contain spaces
                    # ("Changelog Entry") — word splitting would break them.
                    while IFS= read -r ctx; do
                      [[ -z "$ctx" ]] && continue
                      grep -qx -- "$ctx" <<<"$present" || missing+="$ctx"$'\n'
                    done <<< "$required"
                    if [[ -n "$missing" ]]; then
                      dispatched_any=0
                      while IFS= read -r ctx; do
                        [[ -z "$ctx" ]] && continue
                        wf=""
                        case "$ctx" in
                          "Changelog Entry") wf="changelog.yml" ;;
                          "Flake Check"|"Flake Inputs Changed") wf="nix.yml" ;;
                          "Coverage"|"Documentation"|"Format Check"|"Lint (Clippy)"|"Test (macos-latest)"|"Test (ubuntu-latest)") wf="ci.yml" ;;
                          "Dependency Audit"|"Dependency Check"|"License Check"|"SAST Scan"|"Secret Detection"|"Security Advisories"|"Security Audit") wf="security.yml" ;;
                        esac
                        if [[ -n "$wf" ]]; then
                          echo "required context '$ctx' has no check run on head — dispatching $wf on $BRANCH"
                          gh workflow run "$wf" --ref "$BRANCH" --repo "${GITHUB_REPOSITORY}" && dispatched_any=1 || true
                        else
                          echo "required context '$ctx' missing on head, no known dispatchable workflow — needs manual intervention"
                        fi
                      done <<< "$missing"
                      if [[ "$dispatched_any" -eq 1 ]]; then
                        self_healed=1
                        echo "dispatched — waiting for the fresh runs to settle"
                      fi
                    fi
                  fi
                  if [[ "$in_progress" -eq 0 && "$settled_failures" -gt 0 ]]; then
                    if [[ "$reran" -eq 0 ]]; then
                      echo "settled failure — re-running failed jobs once, then waiting again"
                      gh run list --branch "$BRANCH" --limit 25 --json databaseId,conclusion \
                        -q '.[] | select(.conclusion == "failure") | .databaseId' | while read -r id; do
                        gh run rerun "$id" --failed || true
                      done
                      reran=1
                    else
                      echo "check(s) still failing after re-run — release needs manual intervention:"
                      jq -r '.[] | select(.status == "completed" and (.conclusion | ascii_downcase | IN("failure","error","timed_out","cancelled"))) | .conclusion' <<<"$runs" | sort | uniq -c
                      exit 1
                    fi
                  else
                    echo "checks in flight — waiting (attempt $i/50)"
                  fi
                else
                  echo "checks in flight — waiting (attempt $i/50)"
                fi
                ;;
              *)
                echo "merge state '$status' — waiting (attempt $i/50)"
                ;;
            esac
            sleep 60
          done
          if [[ "$merged" -ne 1 ]]; then
            echo "timed out waiting for the release PR to go green — manual intervention"
            exit 1
          fi

      - name: Tag merged commit and push
        if: steps.gate.outputs.proceed == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          BASE_BEFORE: ${{ steps.merge.outputs.base_before }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          # The squash commit's parent must be exactly the main head we
          # captured pre-merge — otherwise main advanced in the window
          # and we would tag the wrong commit.
          if [[ "$(git rev-parse origin/main^)" != "$BASE_BEFORE" ]]; then
            echo "main advanced between merge and tag — manual intervention"
            exit 1
          fi
          git tag "v${NEW_VERSION}" origin/main
          git push -q origin "v${NEW_VERSION}"
          echo "tagged v${NEW_VERSION} at $(git rev-parse --short origin/main)"

      - name: Trigger binary release workflow
        # GITHUB_TOKEN with `actions: write` (see workflow permissions).
        # Tag pushes do not trigger `push: tags:` listeners (GitHub
        # design), so the dispatch is explicit.
        if: steps.gate.outputs.proceed == 'true'
        run: |
          gh workflow run release.yml --ref "v${{ steps.bump.outputs.new }}" --repo "${{ github.repository }}"
          echo "release.yml dispatched for v${{ steps.bump.outputs.new }}"

      - name: Summary
        if: steps.gate.outputs.proceed == 'true'
        run: |
          {
            echo "### Released v${{ steps.bump.outputs.new }}"
            echo "Bumped \`${{ steps.bump.outputs.old }}\` → \`${{ steps.bump.outputs.new }}\`"
            echo "Release PR #${{ steps.pr.outputs.pr_number }} squash-merged, tag pushed, release.yml dispatched."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.new_version != ''
    uses: ./.github/workflows/publish.yml
    with:
      ref: "v${{ needs.release.outputs.new_version }}"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
